<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GoodJobAI · 求职画像</title><link rel="stylesheet" href="{{ url_for('static', path='app.css') }}"></head>
<body>
<header><div class="brand">GoodJobAI</div><nav><a href="/">手动收录岗位</a><a href="/jobs">秋招雷达</a><a href="/applications">投递工作台</a><a class="active" href="/profile">求职画像</a></nav></header>
<main>
  <div class="heading"><div><p class="eyebrow">规则匹配设置</p><h1>求职画像</h1><p>仅保存在本机，用于可解释的本地规则匹配。</p></div><a class="pool-link" href="/jobs">返回雷达</a></div>
  <form class="capture-card" method="post" action="/profile"><section><div class="section-title"><h2>基本信息</h2></div><div class="grid three">
    <label>毕业届别<input name="graduation_year" value="{{ profile.graduation_year|default('') }}" placeholder="如：2027"></label>
    <label>学历<select name="degree">{% for item in ['','大专','本科','硕士','博士'] %}<option value="{{ item }}" {% if profile.degree|default('') == item %}selected{% endif %}>{{ item or '请选择' }}</option>{% endfor %}</select></label>
    <label>学校<input name="school" value="{{ profile.school|default('') }}"></label><label>专业<input name="major" value="{{ profile.major|default('') }}"></label>
    <label>目标城市<input name="target_cities" value="{{ profile.target_cities|default('') }}" placeholder="杭州,上海"></label><label>目标行业<input name="target_industries" value="{{ profile.target_industries|default('') }}"></label>
    <label class="wide">目标方向<div class="tag-editor" data-name="target_directions" data-value="{{ profile.target_directions|default('') }}"></div></label>
    <label class="wide">技能<div class="tag-editor" data-name="skills" data-value="{{ profile.skills|default('') }}"></div></label>
    <label class="wide">硬约束（仅保存展示）<textarea name="constraints" rows="3">{{ profile.constraints|default('') }}</textarea></label>
  </div></section><div class="actions"><button type="submit">保存画像并重新计算</button></div></form>
</main>
<script>document.querySelectorAll('.tag-editor').forEach(function(root){var tags=(root.dataset.value||'').split(/[,，、/;；|&+\s]+/).filter(Boolean);var hidden=document.createElement('input');hidden.type='hidden';hidden.name=root.dataset.name;var input=document.createElement('input');input.placeholder='输入后按回车或逗号';function render(){root.innerHTML='';tags.forEach(function(tag){var chip=document.createElement('button');chip.type='button';chip.className='tag-chip';chip.textContent=tag+' ×';chip.onclick=function(){tags=tags.filter(function(item){return item!==tag});render()};root.appendChild(chip)});hidden.value=tags.join(',');root.appendChild(input);root.appendChild(hidden)}input.addEventListener('keydown',function(event){if(event.key==='Enter'||event.key===','||event.key==='，'){event.preventDefault();var value=input.value.trim();if(value&&!tags.includes(value))tags.push(value);input.value='';render()}});render()})</script>
</body>
</html>
