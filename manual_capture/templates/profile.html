<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GoodJobAI · 求职画像</title><link rel="stylesheet" href="{{ url_for('static', path='app.css?v=20260814r8') }}"></head>
<body><div class="app-shell"><aside class="app-sidebar"><div class="app-brand">GoodJobAI<small>秋招投递管理</small><span class="app-brand-badge">2027 秋招 · 本地工作区</span></div><nav><div class="nav-group"><div class="nav-group-label">总览</div><a class="nav-disabled" aria-disabled="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.5" y="1.5" width="5.5" height="5.5" rx="1"/><rect x="9" y="1.5" width="5.5" height="5.5" rx="1"/><rect x="1.5" y="9" width="5.5" height="5.5" rx="1"/><rect x="9" y="9" width="5.5" height="5.5" rx="1"/></svg>总览</a></div><div class="nav-group"><div class="nav-group-label">岗位管理</div><a href="/jobs"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6"/><circle cx="8" cy="8" r="2.5"/><path d="M8 8L13 4"/></svg>秋招雷达</a><a href="/"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.5" y="1.5" width="13" height="13" rx="2.5"/><path d="M8 4.5v7M4.5 8h7"/></svg>收录岗位</a><a href="/applications"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2L7 9M14 2l-5.5 12L6 9 2.5 7z"/></svg>投递工作台</a></div><div class="nav-group"><div class="nav-group-label">投递管理</div><a href="/progress"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 4h12M2 8h12M2 12h7"/></svg>申请进度</a><a href="/progress?view=email"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.5" y="3" width="13" height="10" rx="2"/><path d="M2.5 4l5.5 4.5L13.5 4"/></svg>邮件待确认</a></div><div class="nav-group"><div class="nav-group-label">个人配置</div><a class="active" href="/profile"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="5" r="3"/><path d="M2.5 14c0-2.8 2.5-4.5 5.5-4.5s5.5 1.7 5.5 4.5"/></svg>求职画像</a><a href="/ai-settings"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2l1.3 3.7L13 7l-3.7 1.3L8 12l-1.3-3.7L3 7l3.7-1.3z"/></svg>AI 设置</a></div><div class="nav-group"><div class="nav-group-label">数据与备份</div><a href="/data-management"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><ellipse cx="8" cy="3.5" rx="5.5" ry="2"/><path d="M2.5 3.5v9c0 1.1 2.5 2 5.5 2s5.5-.9 5.5-2v-9"/><path d="M2.5 8c0 1.1 2.5 2 5.5 2s5.5-.9 5.5-2"/></svg>数据管理</a></div></nav><div class="app-sidebar-footer"><strong>Local</strong>数据仅保存在本机</div></aside><main class="app-main config-page">
  <div class="heading"><div><p class="eyebrow">个人配置</p><h1>求职画像</h1><p>仅保存在本机，用于可解释的本地规则匹配。</p></div><a class="pool-link" href="/jobs">返回雷达</a></div>
  <form class="capture-card" method="post" action="/profile">
    <section><div class="section-title"><h2>基础背景</h2></div><div class="form-grid-2">
      <label class="field">毕业届别<input name="graduation_year" value="{{ profile.graduation_year|default('') }}" placeholder="如：2027"></label>
      <label class="field">学历<select name="degree">{% for item in ['','大专','本科','硕士','博士'] %}<option value="{{ item }}" {% if profile.degree|default('') == item %}selected{% endif %}>{{ item or '请选择' }}</option>{% endfor %}</select></label>
      <label class="field">学校<input name="school" value="{{ profile.school|default('') }}"></label>
      <label class="field">专业<input name="major" value="{{ profile.major|default('') }}"></label>
    </div></section>
    <section><div class="section-title"><h2>求职偏好</h2></div><div class="form-grid-2">
      <label class="field">目标城市<input name="target_cities" value="{{ profile.target_cities|default('') }}" placeholder="杭州,上海"></label>
      <label class="field">目标行业<input name="target_industries" value="{{ profile.target_industries|default('') }}"></label>
      <label class="field field-wide">目标方向<div class="tag-editor" data-name="target_directions" data-value="{{ profile.target_directions|default('') }}"></div></label>
    </div></section>
    <section><div class="section-title"><h2>能力与限制</h2></div><div class="form-grid-2">
      <label class="field field-wide">技能<div class="tag-editor" data-name="skills" data-value="{{ profile.skills|default('') }}"></div></label>
      <label class="field field-wide">硬约束（仅保存展示）<textarea name="constraints" rows="3">{{ profile.constraints|default('') }}</textarea></label>
    </div></section>
    <div class="actions"><button type="submit">保存画像并重新计算</button></div>
  </form>
</main></div>
<script>document.querySelectorAll('.tag-editor').forEach(function(root){var tags=(root.dataset.value||'').split(/[,，、/;；|&+\s]+/).filter(Boolean);var hidden=document.createElement('input');hidden.type='hidden';hidden.name=root.dataset.name;var input=document.createElement('input');input.placeholder='输入后按回车或逗号';function render(){root.innerHTML='';tags.forEach(function(tag){var chip=document.createElement('button');chip.type='button';chip.className='tag tag--chip';chip.textContent=tag+' ×';chip.onclick=function(){tags=tags.filter(function(item){return item!==tag});render()};root.appendChild(chip)});hidden.value=tags.join(',');root.appendChild(input);root.appendChild(hidden)}input.addEventListener('keydown',function(event){if(event.key==='Enter'||event.key===','||event.key==='，'){event.preventDefault();var value=input.value.trim();if(value&&!tags.includes(value))tags.push(value);input.value='';render()}});render()})</script>
</body>
</html>
